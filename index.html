<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6DE1" />
    <meta
      name="description"
      content="Crownstack — stack gold, arm your archers and hold the palisade. An installable, offline hero-defense game."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Crownstack</title>
    <!-- Critical styles for the static title below, so it paints before any script runs. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1b1f2a;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        font-family: ui-rounded, system-ui, sans-serif;
      }
      .boot h1 {
        margin: 0;
        font-weight: 700;
        font-size: clamp(2.75rem, 12vw, 5.5rem);
        line-height: 1;
        color: #f7c948;
        text-shadow: 0 4px 0 #a9780f;
      }
      .boot p {
        margin: 0;
        max-width: 28ch;
        font-size: 1.125rem;
        color: #c3cadb;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app as soon as it mounts. -->
      <main class="boot">
        <h1>Crownstack</h1>
        <p>Stack gold. Arm your archers. Hold the palisade.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
